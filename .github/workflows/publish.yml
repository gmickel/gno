name: Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to npm (false = dry run)"
        required: false
        default: "false"
        type: boolean
  push:
    tags:
      - "v*"

# CLI and desktop are one coordinated release; never cancel a partial publication.
concurrency:
  group: coordinated-release
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # No continue-on-error - releases must pass on all platforms

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Cache Bun's global package cache
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Cache package-smoke embedding model
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v6
        with:
          path: ~/.cache/gno/package-smoke
          key: package-smoke-embeddinggemma-0f741b5a-${{ runner.os }}

      # Windows: Move TEMP to D: drive for faster I/O
      - name: "Set TEMP to D: drive (Windows)"
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:/Temp" | Out-Null
          echo "TEMP=D:/Temp" >> $env:GITHUB_ENV
          echo "TMP=D:/Temp" >> $env:GITHUB_ENV

      - name: Install SQLite (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install sqlite3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint:check

      - name: Test (Unix)
        if: matrix.os != 'windows-latest'
        # Explicit bash so GitHub adds -o pipefail; the TTY-workaround pipe
        # to cat otherwise swallows bun test's exit code (false-green CI).
        shell: bash
        run: bun test | cat
        env:
          CI: "true"

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: bun test --concurrency 1
        env:
          CI: "true"

      - name: Provision pinned package-smoke model
        if: matrix.os == 'macos-latest'
        run: bun scripts/package-smoke-model.ts

      - name: Test packed resident gateway (macOS)
        if: matrix.os == 'macos-latest'
        run: bun run test:package

  package-windows-desktop:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: "Set TEMP to D: drive (Windows)"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:/Temp" | Out-Null
          echo "TEMP=D:/Temp" >> $env:GITHUB_ENV
          echo "TMP=D:/Temp" >> $env:GITHUB_ENV

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install shell dependencies
        working-directory: desktop/electrobun-shell
        run: bun install --frozen-lockfile

      - name: Build desktop shell
        working-directory: desktop/electrobun-shell
        run: bun run build

      - name: Verify packaged runtime
        working-directory: desktop/electrobun-shell
        run: bun scripts/verify-packaged-runtime.ts

      - name: Archive Windows desktop build
        id: archive_windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/electrobun-shell/artifacts" | Out-Null
          $buildDir = Get-ChildItem "desktop/electrobun-shell/build" -Directory | Select-Object -First 1
          if (-not $buildDir) { throw "No Windows desktop build directory found" }
          $zipPath = "desktop/electrobun-shell/artifacts/gno-desktop-beta-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $buildDir.FullName '*') -DestinationPath $zipPath -Force
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v7
        with:
          name: gno-desktop-beta-windows-release
          # Release candidate someone may still be installing: longer than a CI
          # build, still far short of the 90d default that let these pile up.
          retention-days: 30
          path: ${{ steps.archive_windows.outputs.zip_path }}

  package-macos-desktop:
    needs: test
    runs-on: macos-15
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Homebrew SQLite for signed-app compatibility test
        run: |
          brew install sqlite3
          test -f /opt/homebrew/opt/sqlite3/lib/libsqlite3.dylib

      - name: Import Developer ID certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/apple-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Configure notarytool profile
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf "%s" "$APPLE_NOTARY_API_KEY_P8" > "$KEY_PATH"
          xcrun notarytool store-credentials notarytool-profile \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install shell dependencies
        working-directory: desktop/electrobun-shell
        run: bun install --frozen-lockfile

      - name: Build signed/notarized macOS desktop release
        working-directory: desktop/electrobun-shell
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          NOTARYTOOL_PROFILE: notarytool-profile
          ELECTROBUN_BUILD_DIR: ${{ github.workspace }}/desktop/electrobun-shell/build
          ELECTROBUN_ARTIFACT_DIR: ${{ github.workspace }}/desktop/electrobun-shell/artifacts
        run: |
          set -euo pipefail
          bun scripts/release-macos.ts
          test -d "$ELECTROBUN_ARTIFACT_DIR"
          find "$ELECTROBUN_ARTIFACT_DIR" -maxdepth 3 -type f -print | sort

      - name: Launch-test signed macOS desktop release
        env:
          RELEASE_DIR: ${{ github.workspace }}/desktop/electrobun-shell/artifacts/release-macos
        run: |
          set -euo pipefail
          DMG_PATH="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"

          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/gno-desktop-mount.XXXXXX")"
          CRASH_MARKER="$(mktemp "$RUNNER_TEMP/gno-desktop-crash-marker.XXXXXX")"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rmdir "$MOUNT_DIR" || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          test -x "$APP_EXECUTABLE"

          SELFTEST_ROOT="$(mktemp -d "$RUNNER_TEMP/gno-desktop-selftest.XXXXXX")"
          NOTES_DIR="$SELFTEST_ROOT/notes"
          export GNO_CONFIG_DIR="$SELFTEST_ROOT/config"
          export GNO_DATA_DIR="$SELFTEST_ROOT/data"
          export GNO_CACHE_DIR="$SELFTEST_ROOT/cache"
          export GNO_NO_AUTO_DOWNLOAD=1
          export HF_HUB_OFFLINE=1
          mkdir -p "$NOTES_DIR"
          printf '# Signed desktop self-test\n' > "$NOTES_DIR/hello.md"

          PACKAGED_BUN="$APP_PATH/Contents/MacOS/bun"
          PACKAGED_GNO="$APP_PATH/Contents/Resources/app/gno-runtime/src/index.ts"
          test -x "$PACKAGED_BUN"
          test -f "$PACKAGED_GNO"
          test -f /opt/homebrew/opt/sqlite3/lib/libsqlite3.dylib
          "$PACKAGED_BUN" "$PACKAGED_GNO" init "$NOTES_DIR" --name notes

          GNO_ELECTROBUN_SELFTEST=1 "$APP_EXECUTABLE" &
          APP_PID=$!
          APP_STATUS=""
          for _attempt in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              if wait "$APP_PID"; then
                APP_STATUS=0
              else
                APP_STATUS=$?
              fi
              break
            fi
            sleep 1
          done
          if [[ -z "$APP_STATUS" ]]; then
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            echo "Signed desktop self-test timed out" >&2
            exit 1
          fi
          if [[ "$APP_STATUS" -ne 0 ]]; then
            echo "Signed desktop self-test exited $APP_STATUS" >&2
            exit "$APP_STATUS"
          fi

          CRASH_DIRS=()
          for CRASH_DIR in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports"; do
            if [[ -d "$CRASH_DIR" && -r "$CRASH_DIR" ]]; then
              CRASH_DIRS+=("$CRASH_DIR")
            fi
          done

          CRASH_REPORTS=""
          for _attempt in $(seq 1 10); do
            if [[ ${#CRASH_DIRS[@]} -gt 0 ]]; then
              CRASH_REPORTS="$(find "${CRASH_DIRS[@]}" -maxdepth 1 -type f \( -name 'bun*.crash' -o -name 'bun*.ips' -o -name '.bun*.crash' -o -name '.bun*.ips' \) -newer "$CRASH_MARKER" -print 2>/dev/null || true)"
            fi
            if [[ -n "$CRASH_REPORTS" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -n "$CRASH_REPORTS" ]]; then
            echo "Signed desktop self-test produced a Bun crash report" >&2
            printf '%s\n' "$CRASH_REPORTS"
            exit 1
          fi

      - name: Upload macOS desktop package
        uses: actions/upload-artifact@v7
        with:
          name: gno-desktop-beta-macos-release
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/desktop/electrobun-shell/artifacts/release-macos/*.zip
            ${{ github.workspace }}/desktop/electrobun-shell/artifacts/release-macos/*.dmg
            ${{ github.workspace }}/desktop/electrobun-shell/artifacts/release-macos/*.json

  pack-test:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache package-smoke embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/gno/package-smoke
          key: package-smoke-embeddinggemma-0f741b5a-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CSS
        run: bun run build:css

      - name: Verify reproducible browser clipper package
        run: bun run verify:clipper-package

      - name: Provision pinned package-smoke model
        run: bun scripts/package-smoke-model.ts

      - name: Test packed package
        env:
          GNO_PACKAGE_SMOKE_KEEP_TEMP: "1"
          TMPDIR: ${{ runner.temp }}/package-smoke
        run: |
          mkdir -p "$TMPDIR"
          bun run test:package

      - name: Retain exactly the tested tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find "$RUNNER_TEMP/package-smoke" -type f -path '*/pack/gmickel-gno-*.tgz' -print0)
          test "${#packages[@]}" -eq 1
          mkdir -p npm-artifact
          cp "${packages[0]}" npm-artifact/package.tgz
          cd npm-artifact
          sha256sum package.tgz > package.tgz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          retention-days: 30
          path: npm-artifact/*
          if-no-files-found: error

      - name: Upload browser clipper artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-clipper
          retention-days: 30
          path: browser-extension/artifacts/*
          if-no-files-found: error

  publish:
    needs: [pack-test, package-windows-desktop, package-macos-desktop]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish == true
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v7

      # Need Node.js 24+ for npm OIDC support (npm >= 11.5.1)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download tested npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-artifact

      - name: Verify tested artifact and release identity
        shell: bash
        run: |
          set -euo pipefail
          cd npm-artifact
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum --check package.tgz.sha256
          tar -xOf package.tgz package/package.json > "$RUNNER_TEMP/packed-package.json"
          node -e '
            const fs = require("node:fs");
            const packed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/packed-package.json"));
            const source = JSON.parse(fs.readFileSync("../package.json"));
            if (packed.name !== source.name || packed.version !== source.version) throw new Error("Packed identity mismatch");
            if (process.env.GITHUB_REF.startsWith("refs/tags/") && process.env.GITHUB_REF !== "refs/tags/v" + packed.version) throw new Error("Tag/version mismatch");
          '

      - name: Publish tested tarball to npm
        run: npm publish ./npm-artifact/package.tgz --provenance --access public
        # No install/build/repack here: this is the archive pack-test exercised.

  release:
    needs: [publish, package-windows-desktop, package-macos-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download Windows desktop package
        uses: actions/download-artifact@v8
        with:
          name: gno-desktop-beta-windows-release
          path: release-assets/windows

      - name: Download macOS desktop package
        uses: actions/download-artifact@v8
        with:
          name: gno-desktop-beta-macos-release
          path: release-assets/macos

      - name: Download browser clipper package
        uses: actions/download-artifact@v8
        with:
          name: browser-clipper
          path: release-assets/browser-clipper

      - name: Read coordinated release version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract section between this version and next version header (or EOF)
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          # Handle multi-line output
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            release-assets/browser-clipper/*.zip
            release-assets/browser-clipper/*.sha256
            release-assets/windows/*.zip
            release-assets/macos/*.zip
            release-assets/macos/*.dmg
