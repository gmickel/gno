name: Publish GNO skill

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      CLAWHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Released GNO tag to publish (for example v2.2.1)
        required: true
        type: string
      verify_version:
        description: Resume verification of an already submitted skill version without uploading
        required: false
        default: ""
        type: string
      dry_run:
        description: Preview without publishing
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: gno-clawhub-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require an existing public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Stable public release required") else . end'
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Configure publishing credentials
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          token = os.environ.get("CLAWHUB_TOKEN", "")
          if not token and os.environ["DRY_RUN"] != "true":
              raise SystemExit("Configure the CLAWHUB_TOKEN repository secret before publishing.")
          path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          path.write_text(json.dumps({"registry": "https://clawhub.ai", "token": token}))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CLAWHUB_CONFIG_PATH={path}\n")
          PYTHON
      - name: Publish released skill bundle
        env:
          RELEASE_REF: ${{ inputs.ref }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          VERIFY_VERSION: ${{ inputs.verify_version }}
        run: |
          if [[ -n "$VERIFY_VERSION" ]]; then
            [[ "$DRY_RUN" == "false" && "$VERIFY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path("skill-publish.json").write_text(json.dumps({"status": "verification-only", "version": os.environ["VERIFY_VERSION"]}))
          PYTHON
            exit 0
          fi
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          bunx clawhub@0.23.3 skill publish assets/skill \
            --slug gno --owner gmickel --name GNO \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-ref "$RELEASE_REF" --source-commit "$(git rev-parse HEAD)" \
            --source-path assets/skill --json "${args[@]}" > skill-publish.json
          cat skill-publish.json
      - name: Verify published file hashes
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then exit 0; fi
          python3 - <<'PYTHON'
          import hashlib, json, time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          receipt = json.loads(Path("skill-publish.json").read_text())
          version = receipt["version"]
          url = f"https://clawhub.ai/api/v1/skills/gno/verify?version={quote(version, safe='')}&ownerHandle=gmickel"
          deadline = time.monotonic() + 600
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit(f"Skill {version} is not publicly available yet. Check ClawHub processing/moderation and resume with verify_version={version}; do not re-upload.")
              delay = 15
              try:
                  with urlopen(Request(url, headers={"Cache-Control": "no-cache"}), timeout=min(20, remaining)) as response:
                      inspected = json.load(response)
                  if (inspected.get("schema") != "clawhub.skill.verify.v1"
                      or inspected.get("slug") != "gno"
                      or inspected.get("publisherHandle") != "gmickel"
                      or inspected.get("version") != version):
                      raise SystemExit("Unexpected public skill identity or verification schema")
                  Path("skill-inspect.json").write_text(json.dumps(inspected))
                  break
              except HTTPError as error:
                  if error.code not in (404, 429) and error.code < 500:
                      raise SystemExit(f"Public verification returned HTTP {error.code}") from None
                  if error.code == 429:
                      try:
                          delay = max(delay, float(error.headers.get("Retry-After", "15")))
                      except ValueError:
                          pass
              except (URLError, TimeoutError):
                  pass
              print(f"Waiting for public skill {version}; upload receipt is retained.", flush=True)
              time.sleep(min(delay, max(0, deadline - time.monotonic())))

          root = Path("assets/skill")
          expected = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in root.rglob("*") if p.is_file()}
          actual = {f["path"]: f["sha256"] for f in json.load(open("skill-inspect.json"))["artifact"]["files"]}
          if actual != expected:
              raise SystemExit("Published skill file hashes differ from the released bundle")
          print(f"Verified {len(expected)} released source files on ClawHub; registry-generated Skill Card is separate")
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clawhub-skill-publish-json
          path: |
            skill-publish.json
            skill-inspect.json
          if-no-files-found: ignore
