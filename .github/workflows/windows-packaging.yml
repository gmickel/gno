name: Windows Packaging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-packaging.yml"
      - "desktop/electrobun-shell/**"
      - "src/**"
      - "assets/**"
      - "vendor/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "docs/INSTALLATION.md"
      - "docs/WINDOWS.md"
      - "docs/DESKTOP-BETA-ROLLOUT.md"
      - "README.md"

concurrency:
  group: windows-packaging-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set TEMP to runner temp
        shell: pwsh
        run: |
          echo "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          echo "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install shell dependencies
        working-directory: desktop/electrobun-shell
        run: bun install --frozen-lockfile

      - name: Build desktop shell
        working-directory: desktop/electrobun-shell
        run: bun run build

      - name: Verify packaged runtime
        working-directory: desktop/electrobun-shell
        run: bun scripts/verify-packaged-runtime.ts

      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v7
        with:
          name: gno-desktop-beta-windows-build
          # Per-commit CI build (~0.65 GB each). Disposable as soon as the next
          # one lands, so it gets the shortest useful window. Left at the repo
          # default of 90d, this one step had accumulated 164 live copies /
          # ~104 GB. This repo is public, so that storage is free and was fully
          # discounted -- but it still showed as ~$151/mo of gross metered usage,
          # and it would bill immediately if the repo ever went private.
          retention-days: 7
          path: |
            desktop/electrobun-shell/build/dev-win-x64/**
