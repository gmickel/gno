name: Build fts5-snowball

env:
  FTS5_SNOWBALL_COMMIT: f2a5450af5ce810cc3f981ff1ea8de2b4ff82a67

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: fts5stemmer.so
            platform: linux-x64
          - os: macos-latest
            artifact: fts5stemmer.dylib
            platform: darwin-arm64
          - os: macos-15-intel
            artifact: fts5stemmer.dylib
            platform: darwin-x64
          - os: windows-latest
            artifact: fts5stemmer.dll
            platform: windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone fts5-snowball
        shell: bash
        run: |
          git clone https://github.com/abiliojr/fts5-snowball.git
          git -C fts5-snowball checkout "$FTS5_SNOWBALL_COMMIT"
          git -C fts5-snowball submodule update --init --recursive
          test "$(git -C fts5-snowball rev-parse HEAD)" = "$FTS5_SNOWBALL_COMMIT"

      - name: Verify build architecture
        if: runner.os == 'macOS'
        run: |
          EXPECTED_ARCH=${{ matrix.platform == 'darwin-x64' && 'x86_64' || 'arm64' }}
          ACTUAL_ARCH=$(uname -m)
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH" || {
            echo "Expected $EXPECTED_ARCH runner for ${{ matrix.platform }}, got $ACTUAL_ARCH"
            exit 1
          }

      # Linux build
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          cd fts5-snowball
          make
          ls -la fts5stemmer.so

      # macOS build (per issue #12)
      - name: Install SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite3

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          cd fts5-snowball
          # Patch Makefile for Homebrew paths (per issue #12)
          SQLITE_PREFIX=$(brew --prefix sqlite3)
          cat > Makefile << 'EOF'
          SQLITE_INCLUDE=$(SQLITE_PREFIX)/include
          SQLITE_LIB_PATH=$(SQLITE_PREFIX)/lib

          all: libstemmer fts5stemmer.o
          	cc -fPIC -shared -L$(SQLITE_LIB_PATH) -lsqlite3 -o fts5stemmer.so fts5stemmer.o snowball/libstemmer.o
          	@[ "`uname -s`" = "Darwin" ] && mv fts5stemmer.so fts5stemmer.dylib || :

          libstemmer:
          	@if [ ! -f snowball/GNUmakefile ];then \
          		echo -e "\n\nError: snowball is missing!"; \
          		exit 2; \
          	fi
          	$(MAKE) CFLAGS=-fPIC -C snowball

          fts5stemmer.o: src/fts5stemmer.c
          	cc -fPIC -Wall -c -I$(SQLITE_INCLUDE) -Isnowball/include -Isqlite -O3 src/fts5stemmer.c

          clean:
          	@rm *.o
          	$(MAKE) -C snowball clean
          EOF
          # Replace placeholder with actual path
          sed -i '' "s|\$(SQLITE_PREFIX)|${SQLITE_PREFIX}|g" Makefile
          cat Makefile
          make
          ls -la fts5stemmer.dylib
          file fts5stemmer.dylib
          file fts5stemmer.dylib | grep -q "${{ matrix.platform == 'darwin-x64' && 'x86_64' || 'arm64' }}"
          vtool -show-build fts5stemmer.dylib | grep -q 'minos 13.0'
          "$SQLITE_PREFIX/bin/sqlite3" ':memory:' \
            ".load ./fts5stemmer" \
            "CREATE VIRTUAL TABLE docs USING fts5(content, tokenize='snowball english');" \
            "INSERT INTO docs(content) VALUES ('running');" \
            "SELECT CASE count(*) WHEN 1 THEN 'snowball-ok' ELSE 'snowball-failed' END FROM docs WHERE docs MATCH 'run';" \
            | grep -q '^snowball-ok$'

      # Windows build (per gist emirotin/60bd3fb245b96e9fb1dd5069457c7991)
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            make
            perl

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd fts5-snowball
          # Patch Makefile for MSYS2
          cat > Makefile << 'EOF'
          SQLITE_FLAGS=-I/mingw64/include
          SQLITE_LIBS=-L/mingw64/lib -lsqlite3

          all: libstemmer fts5stemmer.o
          	gcc -shared -o fts5stemmer.dll fts5stemmer.o snowball/libstemmer.o $(SQLITE_LIBS)

          libstemmer:
          	@if [ ! -f snowball/GNUmakefile ];then \
          		echo "Error: snowball is missing!"; \
          		exit 2; \
          	fi
          	$(MAKE) CFLAGS=-fPIC CC=gcc -C snowball

          fts5stemmer.o: src/fts5stemmer.c
          	gcc -Wall -c $(SQLITE_FLAGS) -Isnowball/include -Isqlite -O3 src/fts5stemmer.c

          clean:
          	rm -f *.o *.dll
          	$(MAKE) -C snowball clean
          EOF
          cat Makefile
          make
          ls -la fts5stemmer.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fts5stemmer-${{ matrix.platform }}
          path: fts5-snowball/${{ matrix.artifact }}
          retention-days: 7
