# TEMPORARY (fn-201 R1): reproduce the Windows update hang with a phase
# trace. Runs only on the spec branch; removed before merge.
name: fn201 windows hang probe

on:
  push:
    branches: [fn-201-test-and-ci-reliability-windows-update]

permissions:
  contents: read

jobs:
  loop:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Set TEMP to isolated D drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:/Temp" | Out-Null
          echo "TEMP=D:/Temp" >> $env:GITHUB_ENV
          echo "TMP=D:/Temp" >> $env:GITHUB_ENV
      - run: bun install --frozen-lockfile
      - name: Loop concurrency test
        run: bun .github/scripts/fn201-loop.ts 10

  full-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Set TEMP to isolated D drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:/Temp" | Out-Null
          echo "TEMP=D:/Temp" >> $env:GITHUB_ENV
          echo "TMP=D:/Temp" >> $env:GITHUB_ENV
      - run: bun install --frozen-lockfile
      - name: Full suite as CI runs it
        shell: cmd
        run: bun test --max-concurrency=1 --timeout 20000
        env:
          CI: "true"
