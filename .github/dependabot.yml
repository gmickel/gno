# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Bun dependencies (native support since Feb 2025)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Group all non-major updates into single PR
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # These packages form one lint-policy toolchain. Newer versions enable
    # repository-wide rules and require a deliberate migration.
    ignore:
      - dependency-name: "ultracite"
      - dependency-name: "oxlint"
      - dependency-name: "oxlint-tsgolint"
      - dependency-name: "oxfmt"
      # ajv-formats currently installs a second Ajv copy with Bun when the
      # direct Ajv pin moves past 8.17.1, making its nominal types incompatible.
      - dependency-name: "ajv"
    # Limit open PRs to avoid noise
    open-pull-requests-limit: 5
    # Auto-assign for review
    assignees:
      - "gmickel"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"
